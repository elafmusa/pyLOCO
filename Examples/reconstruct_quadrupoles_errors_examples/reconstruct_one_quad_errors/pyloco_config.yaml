# User-facing values for example_one_quad_error.py.
# Python defaults and configuration classes remain in pyLOCO/config.py.

lattice:
  file: betamodel.mat
  use: betamodel

elements:
  bpm_type: Monitor
  corrector_pattern: "S[HFDIJ]*"
  quad_groups:
    - "QD3[AE]*"
    - "QF4[ABDE]*"
    - "QD5[BD]*"

assigned_error:
  # Zero-based AT lattice index. Element 42 is QF4B in betamodel.mat and is
  # included in the quadrupoles fitted below.
  quad_index: 42
  relative_error: 0.05       # (K_machine - K_ideal) / K_ideal

measurement:
  corrector_kick_rad: 100.0e-6
  bpm_noise_rms_m: 0.10e-6   # 0.10 µm RMS independently on every ORM entry
  random_seed: 20260811

# ESRF-EBS RF values. The step is required by pyLOCO's fixed-momentum
# bookkeeping even though this example does not fit RF or dispersion.
rf:
  frequency_hz: 352372169.3993786
  step_hz: 200.0

loco:
  algorithm: lm
  nIter: 3
  nLMIter: 8
  Starting_Lambda: 1.0e-3
  max_lm_lambda: 15.0
  scaled: true
  svd_selection_method: threshold
  svd_threshold: 1.0e-7
  cut: null
  remove_coupling: true
  apply_normalization: false
  normalization_mode: component
  include_dispersion: false
  outlier_rejection: false
  show_svd_plot: false
  plot_fit_parameters: false
  auto_correct_delta: true
  fixedpathlength: false

fit_parameters:
  quadrupoles: {enable: true}
  skew_quadrupoles: {enable: false}
  quadrupole_tilt: {enable: false}
  bpm_gains: {enable: false}
  bpm_coupling: {enable: false}
  corrector_calibration: {enable: false}
  corrector_coupling: {enable: false}
  corrector_energy_shift: {enable: false}
  rf_frequency_shift: {enable: false}

constraints:
  enable: false

output:
  directory: output/one_quad_error
