error_table:
  calibration_error_quads: 1e-3
  calibration_error_other: 1e-6
  magnet_rolls: 1e-6 #rad
  magnet_offsets: 1e-6 #m

  girder_offsets: 1e-6 #m
  girder_rolls: 1e-6  #rad

  bpm_offsets: 1e-6 #m
  bpm_rolls: 1e-6 #rad
  bpm_orbit_noise: 1e-8 #m
  bpm_tbt_noise: 1e-6 #m
  bpm_calibration_error: 1e-6

  corrector_rolls: 1e-6 #rad
  calibration_error_corrector: 1e-6

parameters:
  corrector_limit: 1

lattice:
  lattice_file: betamodel.mat
  simulator: at
  use: betamodel

magnets:
  DL:
    #conf_type: indiv # implied if not present
    regex: ^DL
    exclude: .*_MARKER
    components: 
      - B1: calibration_error_other
      - B2: null
    roll: magnet_rolls
    dx: magnet_offsets
    dy: magnet_offsets
  DQ:
    #conf_type: indiv # implied if not present
    regex: ^DQ
    exclude: .*_MARKER
    components: 
      - B1: calibration_error_other
      - B2: null #calibration_error_other
    roll: magnet_rolls
    dx: magnet_offsets
    dy: magnet_offsets
  quadrupoles:
    regex: ^QD|^QF
    components: 
      - B2: calibration_error_quads
    roll: magnet_rolls
    dx: magnet_offsets
    dy: magnet_offsets
  sextupoles:
    regex: ^SJ|^SF|^SD|^SI
    components: 
      - B1L: calibration_error_corrector
      - A1L: calibration_error_corrector
      - A2: calibration_error_other
      - B3: calibration_error_other
    invert:
      - B1L
    limits:
      - B1L: corrector_limit
      - A1L: corrector_limit
    roll: magnet_rolls
    dx: magnet_offsets
    dy: magnet_offsets
  octupoles: 
    regex: ^O
    components: 
      - B4: calibration_error_other
    roll: magnet_rolls
    dx: magnet_offsets
    dy: magnet_offsets
  correctors:
    regex: ^SH
    #exclude: CXYS.*SD
    components:
      - B1L: calibration_error_corrector
      - A1L: calibration_error_corrector
    limits:
      - B1L: corrector_limit
      - A1L: corrector_limit
    invert:
      - B1L
    roll: corrector_rolls
    dx: magnet_offsets
    dy: magnet_offsets

rf:
  main:
    regex: ^CAV
    voltage: null # V
    phase: null # rad
    frequency: null # Hz

bpms:
  bpms:  ## looks redundant but allows for different bpm families
    regex: ^BPM
    exclude: BPM_TFB|BPM_LFB|BPM_CUR
    dx: bpm_offsets
    dy: bpm_offsets
    roll: bpm_rolls
    orbit_noise: bpm_orbit_noise
    tbt_noise: bpm_tbt_noise
    calibration_error: bpm_calibration_error

