tuning:
    #sort_correctors: True
    HCORR:
      - correctors: B1L
      - sextupoles: B1L
    VCORR: 
      - correctors: A1L
      - sextupoles: A1L

    model_RM_folder: ./

    multipoles:
      - sextupoles: B3
      - octupoles: B4

    bba_magnets:
      - quadrupoles: B2
