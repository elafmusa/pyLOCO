lattice:
  file: betamodel.mat
  use: betamodel

pysc:
  state_file: ESRF_pySC_state.json
  error_configuration: ebs_conf_betamodel.yaml
  random_seed: 1

data:
  orm: data/measured_orm_loco.h5
  dispersion: data/measured_dispersion_loco.h5
  bpm_noise: data/measured_BPM_noise_loco.h5

elements:
  corrector_pattern: "S[HFDIJ]*"
  quadrupole_groups: ["QD3[AE]*", "QF4[ABDE]*", "QD5[BD]*"]

measurement:
  # "simulate" performs the measurements through pySC. Change to "cached" for
  # a faster run using the preserved HDF5 data generated by the same machine.
  source: simulate
  corrector_kick_rad: 100.0e-6
  bpm_noise_repetitions: 100

rf:
  frequency_hz: 352372169.3993786
  step_hz: 200.0

loco:
  nIter: 5
  nLMIter: 10
  Starting_Lambda: 1.0e-3
  max_lm_lambda: 15.0
  scaled: true
  svd_selection_method: threshold
  svd_threshold: 1.0e-7
  cut: 500
  show_svd_plot: false
  outlier_rejection: true
  sigma_outlier: 10.0
  apply_normalization: true
  normalization_mode: component
  include_dispersion: false
  fit_list: [quads, hbpm_gain, vbpm_gain, hcor_cal, vcor_cal, HCMEnergyShift]

output:
  directory: output/pysc_simulated_commissioning
