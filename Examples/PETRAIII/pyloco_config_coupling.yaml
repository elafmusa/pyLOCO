# Coupling profile for the PETRA III coupling script and notebook.
lattice:
  file: data/p3_low_beta.mat

data:
  orm: data/measured_orm_loco.h5
  dispersion: data/measured_dispersion_loco.h5
  bpm_noise: data/measured_BPM_noise_loco.h5
  corrector_steps: data/CMstep.npz
  horizontal_corrector_names: data/HCM_names.txt
  vertical_corrector_names: data/VCM_names.txt
  bpm_names: data/BPM_names.txt
  quadrupole_indices: data/quad_ind.npy
  quadrupole_mode: individual
  skew_indices: data/skew_ind.npy

matlab_reference:
  # Reference parameter vector produced by the corresponding one-iteration
  # MATLAB LOCO workflow. It has the same block ordering as standard_fit_list.
  standard_one_iteration: data/matlab_fit_1iter.npy

# Positions in the ordered BPM-name list, not AT lattice indices.
bad_bpm_positions: [24, 104, 108, 111, 123, 138, 144, 153, 161, 162, 243]

rf:
  frequency_hz: 499664399.4230182
  harmonic_number: 3840
  step_hz: -3000.0

loco:
  algorithm: lm
  nIter: 1
  nLMIter: 10
  Starting_Lambda: 1.0e-3
  max_lm_lambda: 15.0
  scaled: true
  svd_selection_method: threshold
  svd_threshold: 1.0e-7
  cut: 397
  show_svd_plot: false
  outlier_rejection: true
  sigma_outlier: 10.0
  apply_normalization: true
  normalization_mode: component
  remove_coupling: false
  skew_individuals: true
  tilt_individuals: true
  skew_attribute: PolynomB
  calculate_delta_chi2: false
  include_dispersion: false
  horizontal_dispersion_weight: 1.0
  vertical_dispersion_weight: 1.0

# Parameter selection is independent of constraints. These switches are the
# only place where fitted blocks are enabled or disabled.
fit_parameters:
  quadrupoles: {enable: true}
  skew_quadrupoles: {enable: true}
  quadrupole_tilt: {enable: true}
  bpm_gains: {enable: true}
  bpm_coupling: {enable: true}
  corrector_calibration: {enable: true}
  corrector_coupling: {enable: true}
  hcm_energy_shift: {enable: true}
  vcm_energy_shift: {enable: true}
  rf_frequency_shift: {enable: false}

constraints:
  enable: false
  quadrupoles:
    relative_sigma: 1.0e-4
    minimum_sigma: 1.0e-12
    default_weight: 0.0
    # One edit changes the strength for every selected zero-based family.
    selected_weight: 1.0
    selected_families: []
    # Optional exceptions take precedence: {12: 2.0, 27: 0.5}
    weighted_families: {}
  skew_quadrupoles:
    sigma: 1.0e-4
    default_weight: 0.0

# Continue from a previously saved run. The directory can be either the run
# directory (containing results/) or the results directory itself.
resume:
  enabled: false
  directory: output/measured_orm
  ring_file: ring_pyloco.mat
  fit_dict_file: fit_dict.pkl
  fit_results_file: fit_results.npy

output:
  run_name: default_measurement
  standard: output/measured_orm
  coupling: output/measured_coupling
  constrained: output/constrained_case
  matlab_comparison: output/matlab_comparison
