# User-facing configuration shared by the two PETRA III measured-data examples.
lattice:
  file: data/p3_low_beta.mat

data:
  orm: data/measured_orm_loco.h5
  dispersion: data/measured_dispersion_loco.h5
  bpm_noise: data/measured_BPM_noise_loco.h5
  corrector_steps: data/CMstep.npz
  horizontal_corrector_names: data/HCM_names.txt
  vertical_corrector_names: data/VCM_names.txt
  bpm_names: data/BPM_names.txt
  quadrupole_indices: data/quad_ind.npy
  skew_indices: data/skew_ind.npy

matlab_reference:
  # Reference parameter vector produced by the corresponding one-iteration
  # MATLAB LOCO workflow. It has the same block ordering as standard_fit_list.
  standard_one_iteration: data/matlab_fit_1iter.npy

# Positions in the ordered BPM-name list, not AT lattice indices.
bad_bpm_positions: [24, 104, 108, 111, 123, 138, 144, 153, 161, 162, 243]

rf:
  frequency_hz: 499664399.4230182
  step_hz: -3000.0

loco:
  nIter: 1
  nLMIter: 10
  Starting_Lambda: 1.0e-3
  max_lm_lambda: 15.0
  scaled: true
  svd_selection_method: threshold
  svd_threshold: 1.0e-7
  cut: 397
  show_svd_plot: false
  outlier_rejection: true
  sigma_outlier: 10.0
  apply_normalization: true
  normalization_mode: component
  include_dispersion: false
  horizontal_dispersion_weight: 1.0
  vertical_dispersion_weight: 1.0
  standard_fit_list: [quads, hbpm_gain, vbpm_gain, hcor_cal, vcor_cal, HCMEnergyShift]
  coupling_fit_list: [quads, skew_quads, quads_tilt, hbpm_gain, vbpm_gain, hcor_cal, vcor_cal, HCMEnergyShift, VCMEnergyShift, hbpm_coupling, vbpm_coupling, hcor_coupling, vcor_coupling]

output:
  standard: output/measured_orm
  coupling: output/measured_coupling
  matlab_comparison: output/matlab_comparison
