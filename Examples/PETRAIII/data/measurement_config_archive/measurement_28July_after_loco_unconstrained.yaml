# Same PETRA III 28 July measurement as case C, without ConstraintConfig.
lattice:
  file: ../p3_v24_C_original.mat

data:
  orm: ../measurement_28July_after_loco_C/ORM_before_LOCO_merged.h5
  dispersion: ../measurement_28July_after_loco_C/Dispersion_RF_difference.h5
  dispersion_datasets: {horizontal: mean_orbit_x, vertical: mean_orbit_y}
  bpm_noise: ../measurement_28July_after_loco_C/BPM_noise_2026-07-28_11-11-15.h5
  bpm_noise_datasets: {horizontal: std_orbit_x, vertical: std_orbit_y}
  corrector_steps: {horizontal_rad: 1.0e-4, vertical_rad: 1.0e-4}
  horizontal_corrector_names: ../HCM_names_control.txt
  vertical_corrector_names: ../VCM_names_control.txt
  bpm_names: ../BPM_names.txt
  quadrupole_indices: ../quad_ind_2024.npy
  skew_indices: ../skew_ind_2026.npy
  quadrupole_mode: family
  quadrupole_family_groups: ../quad_family_groups_new.npy

expected_counts:
  bpms_before_removal: 246
  bpms_after_removal: 238
  horizontal_correctors: 184
  vertical_correctors: 193
  quadrupole_families: 193
  physical_quadrupoles: 398
  skew_quadrupoles: 16

bad_bpm_positions: [71, 104, 108, 123, 138, 153, 161, 243]

rf:
  frequency_hz: 499664399.4230182
  harmonic_number: 3840
  step_hz: -3000.0

loco:
  algorithm: lm
  nIter: 8
  nLMIter: 10
  Starting_Lambda: 1.0e-3
  max_lm_lambda: 15.0
  scaled: true
  svd_selection_method: threshold
  svd_threshold: 1.0e-7
  cut: 397
  show_svd_plot: true
  outlier_rejection: true
  sigma_outlier: 10.0
  apply_normalization: true
  normalization_mode: component
  include_dispersion: true
  horizontal_dispersion_weight: 5.0
  vertical_dispersion_weight: 5.0
  remove_coupling: false
  skew_individuals: true
  tilt_individuals: true
  calculate_delta_chi2: false
  plot_fit_parameters: false
  auto_correct_delta: true
  fixedpathlength: false
  skew_attribute: PolynomB
  skew_correction_reference_attribute: PolynomA
fit_parameters:
  quadrupoles: {enable: true}
  skew_quadrupoles: {enable: true}
  quadrupole_tilt: {enable: true}
  bpm_gains: {enable: true}
  bpm_coupling: {enable: true}
  corrector_calibration: {enable: true}
  corrector_coupling: {enable: true}
  corrector_energy_shift: {enable: true}
  rf_frequency_shift: {enable: false}

constraints:
  enable: false

output:
  root: ../../output
  run_name: measurement_28July_after_loco_unconstrained
