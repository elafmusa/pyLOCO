# Self-contained migration of Run_LOCO/C.ipynb, "Constrain_case 3_new".
lattice:
  file: ../data/p3_v24_C_original.mat

data:
  orm: ../data/measurements_12Aug/before_change_quad/ORM_ORM_100urad_short_2026-08-12_15-31-30.h5
  dispersion: ../data/measurements_12Aug/before_change_quad/Dispersion_18Aug.h5
  dispersion_datasets:
    horizontal: mean_orbit_x
    vertical: mean_orbit_y
  bpm_noise: ../data/measurements_12Aug/before_change_quad/BPM_noise_2026-08-12_15-22-19.h5
  bpm_noise_datasets:
    horizontal: std_orbit_x
    vertical: std_orbit_y
  corrector_steps:
    horizontal_rad: 1.0e-4
    vertical_rad: 1.0e-4
  horizontal_corrector_names: ../data/HCM_names_40.txt
  vertical_corrector_names: ../data/VCM_names_40.txt
  bpm_names: ../data/BPM_names.txt
  quadrupole_indices: ../data/quad_ind_2024.npy
  skew_indices: ../data/skew_ind_2026.npy
  quadrupole_mode: individual

expected_counts:
  bpms_before_removal: 246
  bpms_after_removal: 238
  horizontal_correctors: 40
  vertical_correctors: 40
  quadrupole_families: 398
  physical_quadrupoles: 398
  skew_quadrupoles: 16

bad_bpm_positions: [71, 104, 108, 123, 138, 153, 161, 243]

rf:
  frequency_hz: 499664399.4230182
  harmonic_number: 3840
  step_hz: -3000.0

loco:
  algorithm: lm
  nIter: 1
  nLMIter: 10
  Starting_Lambda: 1.0e-3
  max_lm_lambda: 15.0
  scaled: true
  svd_selection_method: user_input
  svd_threshold: 1.0e-7
  cut: 1900
  show_svd_plot: false
  outlier_rejection: true
  sigma_outlier: 10.0
  apply_normalization: true
  normalization_mode: component
  include_dispersion: true
  horizontal_dispersion_weight: 5.0
  vertical_dispersion_weight: 5.0
  remove_coupling: false
  skew_individuals: true
  tilt_individuals: true
  calculate_delta_chi2: false
  plot_fit_parameters: false
  auto_correct_delta: true
  fixedpathlength: false
  skew_attribute: PolynomB
  skew_correction_reference_attribute: PolynomA
  constrained_fit_list: [quads, skew_quads, quads_tilt, hbpm_gain, vbpm_gain, hcor_cal, vcor_cal, hbpm_coupling, vbpm_coupling, hcor_coupling, vcor_coupling]

constraints:
  enable: true
  quadrupoles:
    # Exact old-script constraint: sigma = K * 1e-4, zero weight everywhere
    # except Python fit-parameter indices 250:351 (250 through 350).
    relative_sigma: 1.0e-4
    minimum_sigma: 1.0e-12
    default_weight: 0.0
    selected_weight: 1.0
    selected_families: &old_constrained_quads
      [250, 251, 252, 253, 254, 255, 256, 257, 258, 259,
       260, 261, 262, 263, 264, 265, 266, 267, 268, 269,
       270, 271, 272, 273, 274, 275, 276, 277, 278, 279,
       280, 281, 282, 283, 284, 285, 286, 287, 288, 289,
       290, 291, 292, 293, 294, 295, 296, 297, 298, 299,
       300, 301, 302, 303, 304, 305, 306, 307, 308, 309,
       310, 311, 312, 313, 314, 315, 316, 317, 318, 319,
       320, 321, 322, 323, 324, 325, 326, 327, 328, 329,
       330, 331, 332, 333, 334, 335, 336, 337, 338, 339,
       340, 341, 342, 343, 344, 345, 346, 347, 348, 349, 350]
  skew_quadrupoles:
    sigma: 1.0e-4
    default_weight: 0.0

output:
  root: ../output
  # Preserve the earlier unconstrained result for comparison.
  run_name: measurement_18Aug_before_old_quad_constraint
