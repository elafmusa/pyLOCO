# Second-stage fit of the 18Aug after-quadrupole-change measurement.
# Starts from the fitted lattice and fitted parameters of the corresponding
# before-change run, and applies a weight-5 prior to every quadrupole family.
lattice:
  file: ../data/p3_v24_C_original.mat

data:
  orm: ../data/measurements_12Aug/after_change_quad/ORM_ORM_100urad_short_2026-08-12_15-59-09.h5
  dispersion: ../data/measurements_12Aug/after_change_quad/Dispersion_18Aug.h5
  dispersion_datasets:
    horizontal: mean_orbit_x
    vertical: mean_orbit_y
  # No separate after-change noise measurement is present, so use the BPM
  # noise measured immediately before the quadrupole change.
  bpm_noise: ../data/measurements_12Aug/before_change_quad/BPM_noise_2026-08-12_15-22-19.h5
  bpm_noise_datasets:
    horizontal: std_orbit_x
    vertical: std_orbit_y
  corrector_steps:
    horizontal_rad: 1.0e-4
    vertical_rad: 1.0e-4
  horizontal_corrector_names: ../data/HCM_names_40.txt
  vertical_corrector_names: ../data/VCM_names_40.txt
  bpm_names: ../data/BPM_names.txt
  quadrupole_indices: ../data/quad_ind_2024.npy
  skew_indices: ../data/skew_ind_2026.npy
  quadrupole_mode: family
  quadrupole_family_groups: ../data/quad_family_groups_new.npy

expected_counts:
  bpms_before_removal: 246
  bpms_after_removal: 238
  horizontal_correctors: 40
  vertical_correctors: 40
  quadrupole_families: 193
  physical_quadrupoles: 398
  skew_quadrupoles: 16

bad_bpm_positions: [71, 104, 108, 123, 138, 153, 161, 243]

rf:
  frequency_hz: 499664399.4230182
  harmonic_number: 3840
  step_hz: -3000.0

loco:
  algorithm: lm
  nIter: 10
  nLMIter: 10
  Starting_Lambda: 1.0e-3
  max_lm_lambda: 15.0
  scaled: true
  svd_selection_method: threshold
  svd_threshold: 1.0e-7
  cut: 397
  show_svd_plot: false
  outlier_rejection: true
  sigma_outlier: 10.0
  apply_normalization: true
  normalization_mode: component
  include_dispersion: true
  horizontal_dispersion_weight: 10.0
  vertical_dispersion_weight: 10.0
  remove_coupling: false
  skew_individuals: true
  tilt_individuals: true
  calculate_delta_chi2: false
  plot_fit_parameters: false
  auto_correct_delta: true
  fixedpathlength: false
  skew_attribute: PolynomB
  skew_correction_reference_attribute: PolynomA
  constrained_fit_list: [quads, skew_quads, quads_tilt, hbpm_gain, vbpm_gain, hcor_cal, vcor_cal, hbpm_coupling, vbpm_coupling, hcor_coupling, vcor_coupling]

constraints:
  enable: true
  quadrupoles:
    relative_sigma: 1.0e-4
    minimum_sigma: 1.0e-12
    default_weight: 5.0
  skew_quadrupoles:
    sigma: 1.0e-4
    default_weight: 0.0

resume:
  enabled: true
  # This must be run after the constrained before-change configuration.
  directory: ../output/measurement_18Aug_before_changing_quad_weight5
  ring_file: ring_pyloco.mat
  fit_dict_file: fit_dict.pkl
  fit_results_file: fit_results.npy

output:
  root: ../output
  run_name: measurement_18Aug_after_quad_resumed_weight5
